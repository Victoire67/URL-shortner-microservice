# Shared settings for both app profiles
x-app: &app
  build: .
  env_file: .env
  depends_on:
    redis:
      condition: service_healthy
    db:
      condition: service_healthy

services:
  # Development: Django dev server with debug on and hot reloading
  web:
    <<: *app
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    command: sh -c "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  # Production: gunicorn with multiple workers (docker compose --profile prod up)
  web-prod:
    <<: *app
    profiles: ["prod"]
    command: sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --config gunicorn.conf.py"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: db
    ports:
      - "8001:8000"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  redis-data:
  postgres-data:
