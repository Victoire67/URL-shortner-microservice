[project]
name = "url-shortner"
version = "0.1.0"
description = ""
authors = [
    {name = "victoire67",email = "ansimavicky@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-restx (>=1.3.2,<2.0.0)",
    "flask-injector (>=0.15.0,<0.16.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "gunicorn (>=26.2.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
