[project]
name = "url-shortner"
version = "0.1.0"
description = ""
authors = [
    {name = "victoire67",email = "ansimavicky@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "redis (>=8.1.0,<9.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "dependency-injector (>=4.49.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "fakeredis (>=2.40.0,<3.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
